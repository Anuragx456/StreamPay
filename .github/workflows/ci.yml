name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: App (lint · build · web + watcher tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  contract:
    name: Contract (test · build wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/subscription
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # soroban-sdk 27 targets the wasm32v1-none triple.
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/subscription/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/subscription/Cargo.lock') }}

      - name: Install system dependencies (libdbus for stellar-cli)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Test
        run: cargo test

      - name: Build wasm
        run: stellar contract build
