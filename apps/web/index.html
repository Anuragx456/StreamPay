<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0b0a" media="(prefers-color-scheme: dark)" />
    <title>StreamPay — Soroban subscription streams</title>
    <script>
      // Apply the persisted / system theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('streampay-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'light' || stored === 'dark' ? stored : systemDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
